services:
  web:
    build: .
    command: ./scripts/run_dev.sh
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kotoku}:${DB_PASSWORD:-kotoku}@db:5432/${DB_NAME:-kotoku}
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      AWS_S3_ENDPOINT_URL: http://minio:9000
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,192.168.129.100"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kotoku}:${DB_PASSWORD:-kotoku}@db:5432/${DB_NAME:-kotoku}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kotoku}:${DB_PASSWORD:-kotoku}@db:5432/${DB_NAME:-kotoku}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-kotoku}
      POSTGRES_USER: ${DB_USER:-kotoku}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kotoku}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kotoku} -d ${DB_NAME:-kotoku}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@kotoku.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kotokuadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kotokuadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
